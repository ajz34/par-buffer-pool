name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }} / ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable }
          - { os: macos-latest, rust: stable }
          - { os: windows-latest, rust: stable }
          # MSRV: the minimum the crate itself claims (`rust-version` in
          # Cargo.toml). The lockfile pins rayon 1.10 / rayon-core 1.12,
          # whose MSRV (1.63) is compatible; newer rayon needs 1.80.
          - { os: ubuntu-latest, rust: "1.66" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # The self dev-dependency turns `stats` on for tests, examples, and
      # doc tests, so no extra feature flags are needed here.
      - run: cargo test --all-features

  lint:
    name: clippy, fmt, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Builds the crate exactly as it would be uploaded: catches packaging
      # problems (missing files, feature gating on the published manifest).
      - run: cargo package --allow-dirty

  doc:
    name: doc (links must resolve)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same flags docs.rs uses, minus the nightly-only example scraping:
      # a broken intra-doc link fails the build instead of rendering as text.
      - run: cargo doc --no-deps --all-features --document-private-items
