[package]
name = "par-buffer-pool"
version = "0.1.0"
edition = "2021"
rust-version = "1.66"
license = "MIT OR Apache-2.0"
description = "A tiny, dependency-free, thread-safe buffer pool with RAII guards, for reusing scratch buffers across rayon/std threads"
readme = "README.md"
keywords = ["pool", "buffer", "rayon", "reuse", "no-std"]
categories = ["concurrency", "memory-management", "science"]
# there are intentionally no runtime dependencies

[dependencies]

[dev-dependencies]
rayon = "1.8"

[[example]]
name = "rayon_scratch"
doc-scrape-examples = true

[[example]]
name = "tiled_contraction"
doc-scrape-examples = true

[[example]]
name = "detach_collect"

[[example]]
name = "size_buckets"

[[example]]
name = "scoped_threads"

[[example]]
name = "alloc_bench"
